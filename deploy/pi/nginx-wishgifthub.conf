# Inclus dans le server par défaut de l'hôte (et non au niveau http).
location = /wishgifthub {
    return 301 /wishgifthub/;
}

location /wishgifthub/api/ {
    proxy_pass http://127.0.0.1:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_intercept_errors on;
    error_page 502 504 =503 @wishgifthub_unavailable;
}

location @wishgifthub_unavailable {
    default_type application/json;
    return 503 '{"message":"Le backend WishGiftHub est indisponible. Vérifier sa configuration et son service."}';
}

location /wishgifthub/assets/ {
    root /opt/wishgifthub/frontend;
    try_files $uri =404;
}

location /wishgifthub/ {
    root /opt/wishgifthub/frontend;
    index index.html;
    try_files $uri $uri/ /wishgifthub/index.html;
    add_header Cache-Control "no-cache";
}
